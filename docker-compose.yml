# Backstage — Docker stack: nginx (host :3000) → app → postgres.
# Brought up by scripts/deploy-dev.sh; never used for production by automation.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: change_me_in_production
      POSTGRES_DB: backstage
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backstage -d backstage"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # host port for local `pnpm dev` + drizzle-kit; override with DB_PORT
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  # dev email catcher — UI at http://localhost:8025 (T-062)
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025" # web UI
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP for local `pnpm dev` (in-network uses mailpit:1025)

  # one-shot schema migration — runs to completion before the app starts, so
  # a fresh `docker compose up` on an empty database Just Works. Uses the
  # build stage because the slim runtime image has no drizzle-kit.
  migrate:
    build:
      context: .
      target: build
    command: pnpm db:migrate
    restart: "no"
    environment:
      DATABASE_URL: postgres://backstage:change_me_in_production@db:5432/backstage
      AUTH_SECRET: migrate-step-placeholder-secret32
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://backstage:change_me_in_production@db:5432/backstage
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      # Public URL. Next standalone reports its bind address (0.0.0.0:3000)
      # as the request host, so Auth.js needs an explicit AUTH_URL for
      # correct absolute redirects. Override both when serving behind a
      # domain/reverse proxy.
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000/api/auth}
      # CHANGE THIS before exposing the app: openssl rand -base64 32
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me}
      UPLOADS_DIR: /data/uploads
      # AI assistant (EPIC-014) — interpolated from the host .env, never
      # hardcoded here
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  db_data:
  uploads:
