# RVC Backstage — reverse proxy. Serves the app; /uploads stays auth-gated
# through the app (nginx never serves files directly until the app signs them).

# Preserve the original scheme when a fronting proxy (Cloudflare Tunnel on
# a tunnel/CDN) already set X-Forwarded-Proto; fall back to our own scheme
# for direct localhost access.
map $http_x_forwarded_proto $client_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # Dataroom uploads (EPIC-017) need their own rules. The default 50m cap
    # would reject a rider or a venue video outright, and — the subtler
    # problem — nginx buffers a request body to its own disk before passing
    # it on, so a large upload fills the system NVMe *before* the app can
    # apply the event's quota. Streaming it through hands every byte to
    # src/lib/dataroom/storage.ts, which counts as it writes and aborts the
    # moment the allowance is exceeded.
    location = /api/dataroom/upload {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        # 0 = no nginx-side limit; the quota is the app's decision, and it is
        # the only one that knows the event's remaining space
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        # $http_host keeps the port — Next.js server actions verify
        # Origin (localhost:3000) against the forwarded host; bare $host
        # ("localhost") makes every form POST fail with
        # "Invalid Server Actions request".
        proxy_set_header Host $http_host;
        # Auth.js (trustHost) prefers X-Forwarded-Host when building
        # absolute redirect URLs — without it, redirects leak the app's
        # bind address (0.0.0.0:3000).
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        # SSE (in-app notifications) needs buffering off
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
